  <main>
    <section class="seccion">
      <div class="contenedor">
        <h1 class="titulo-seccion">CONTACTO</h1>
        <div class="dos-columnas dos-columnas--arriba">
          <div>
            <ul class="datos-contacto">
              <li>Mail: <a href="mailto:pedidos@papierwaren.com.mx">pedidos@papierwaren.com.mx</a></li>
              <li>Teléfonos: <a href="tel:5580393913">55 8039 3913</a> y <a href="tel:5521910046">55 2191 0046</a></li>
            </ul>
            <div class="contacto__logo">
              <img src="assets/img/logo-grande.png" alt="Logotipo Papier Waren" width="200" height="200" loading="lazy">
            </div>
          </div>
          <div>
            <form class="formulario" action="/api/enviar" method="post" novalidate>
              <input type="hidden" name="formulario" value="contacto">
              <label class="trampa" aria-hidden="true">No llenar <input type="text" name="sitio_web" tabindex="-1" autocomplete="off"></label>
              <label>Tu nombre
                <input type="text" name="nombre" required autocomplete="name">
              </label>
              <label>Tu correo electrónico
                <input type="email" name="correo" required autocomplete="email">
              </label>
              <label>Mensaje
                <textarea name="mensaje" rows="4" required></textarea>
              </label>
              <button class="boton" type="submit">Enviar</button>
              <div class="formulario__estado" role="status" aria-live="polite"></div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section class="seccion seccion--gris" id="facturacion">
      <div class="contenedor dos-columnas">
        <div>
          <form class="formulario" action="/api/enviar" method="post" enctype="multipart/form-data" novalidate>
            <input type="hidden" name="formulario" value="facturacion">
            <label class="trampa" aria-hidden="true">No llenar <input type="text" name="sitio_web" tabindex="-1" autocomplete="off"></label>
            <label>RFC
              <input type="text" name="rfc" maxlength="13" style="text-transform:uppercase">
            </label>
            <label>Razón social
              <input type="text" name="razon">
            </label>
            <label>Tu correo electrónico
              <input type="email" name="correo" required autocomplete="email">
            </label>
            <label>Foto de la nota
              <input type="file" name="ticket" accept="image/*,.pdf">
            </label>
            <button class="boton" type="submit">Enviar</button>
            <div class="formulario__estado" role="status" aria-live="polite"></div>
          </form>
        </div>
        <div class="facturar">
          <h2>¿Necesitas Facturar?</h2>
          <img src="assets/img/facturar.png" alt="Facturación" width="250" height="226" loading="lazy">
        </div>
      </div>
    </section>
  </main>
